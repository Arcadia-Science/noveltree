# Lima VM configuration for x86_64 with Rosetta emulation
# Optimized for running Nextflow with Singularity/Apptainer

vmType: "vz"
rosetta:
  enabled: true
  binfmt: true

arch: "aarch64"

cpus: 10
memory: "24GiB"
disk: "100GiB"

images:
- location: "https://cloud-images.ubuntu.com/releases/24.04/release/ubuntu-24.04-server-cloudimg-arm64.img"
  arch: "aarch64"

mounts:
- location: "~"
  writable: false

containerd:
  system: false
  user: false

provision:
- mode: system
  script: |
    #!/bin/bash
    set -eux -o pipefail

    # Install Apptainer
    if ! command -v apptainer >/dev/null 2>&1; then
      echo "Installing Apptainer..."
      add-apt-repository -y ppa:apptainer/ppa
      apt-get update
      apt-get install -y apptainer
    fi

    # Install Java for Nextflow
    if ! command -v java >/dev/null 2>&1; then
      echo "Installing Java..."
      apt-get install -y default-jre
    fi

    # Install Nextflow
    if ! command -v nextflow >/dev/null 2>&1; then
      echo "Installing Nextflow..."
      cd /usr/local/bin
      curl -s https://get.nextflow.io | bash
    fi

probes:
- script: |
    #!/bin/bash
    set -eux -o pipefail
    if ! timeout 30s bash -c "until command -v apptainer >/dev/null 2>&1; do sleep 3; done"; then
      echo >&2 "apptainer is not installed yet"
      exit 1
    fi
  hint: See "/var/log/cloud-init-output.log" in the guest
